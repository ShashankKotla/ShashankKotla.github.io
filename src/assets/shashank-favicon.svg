<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the meteor body -->
    <radialGradient id="meteorGradient" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0.8" />
    </radialGradient>
    
    <!-- Gradient for blue flame trail -->
    <linearGradient id="blueFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0.2" />
    </linearGradient>
    
    <!-- Gradient for purple flame trail -->
    <linearGradient id="purpleFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.15" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Soft glow filter for trails -->
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background (transparent) -->
  <rect width="64" height="64" fill="transparent"/>
  
  <!-- Purple flame trail (outer) -->
  <path d="M15 45 Q25 40 35 35 Q30 42 20 48 Q12 52 8 58 Q10 50 15 45Z" 
        fill="url(#purpleFlame)" 
        filter="url(#softGlow)" 
        opacity="0.7"/>
  
  <!-- Blue flame trail (inner) -->
  <path d="M20 40 Q28 36 36 32 Q32 38 24 42 Q18 46 12 50 Q16 44 20 40Z" 
        fill="url(#blueFlame)" 
        filter="url(#softGlow)" 
        opacity="0.8"/>
  
  <!-- Additional wispy trail -->
  <path d="M25 38 Q30 35 35 30 Q32 35 28 38 Q22 42 18 46 Q22 40 25 38Z" 
        fill="url(#blueFlame)" 
        opacity="0.4"/>
  
  <!-- Meteor body (main) -->
  <ellipse cx="42" cy="22" rx="8" ry="6" 
           fill="url(#meteorGradient)" 
           filter="url(#glow)"
           transform="rotate(45 42 22)"/>
  
  <!-- Meteor core highlight -->
  <ellipse cx="40" cy="20" rx="3" ry="2" 
           fill="#ffffff" 
           opacity="0.8"
           transform="rotate(45 40 20)"/>
  
  <!-- Small sparkle effects -->
  <circle cx="35" cy="28" r="1" fill="#60a5fa" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="30" cy="35" r="0.8" fill="#a78bfa" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="38" cy="30" r="0.6" fill="#ffffff" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>